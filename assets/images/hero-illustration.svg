<svg viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Preview of a Cybersecurity Knowledge Base document page">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#334155" />
    </pattern>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="nodeBGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <radialGradient id="badgeGrad" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#2563eb" />
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    <filter id="badgeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2563eb" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- dotted backdrop, peeking out behind the card -->
  <rect x="118" y="76" width="480" height="410" fill="url(#dots)" opacity="0.6" />

  <!-- window card -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="30" width="500" height="430" rx="22" fill="#0f172a" />
  </g>
  <rect x="70" y="30" width="500" height="430" rx="22" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- title bar -->
  <circle cx="96" cy="52" r="5" fill="#f87171" />
  <circle cx="114" cy="52" r="5" fill="#fbbf24" />
  <circle cx="132" cy="52" r="5" fill="#34d399" />

  <rect x="210" y="42" width="320" height="20" rx="10" fill="#1a2436" />
  <path d="M 224 49 h6 v-2.5 a3 3 0 0 0 -6 0 z" fill="none" stroke="#64748b" stroke-width="1.3" />
  <rect x="222" y="49" width="10" height="7" rx="1.5" fill="#64748b" />
  <text x="240" y="55.5" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="9" fill="#94a3b8">cybersecurity.metacog.co.kr/docs</text>

  <line x1="70" y1="70" x2="570" y2="70" stroke="#1e293b" stroke-width="1" />

  <!-- sidebar: category dots -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <rect x="94" y="103" width="14" height="14" rx="4" fill="#3b82f6" />
    <rect x="118" y="107" width="42" height="6" rx="3" fill="#334155" />

    <rect x="94" y="143" width="14" height="14" rx="4" fill="#06b6d4" />
    <rect x="118" y="147" width="34" height="6" rx="3" fill="#334155" />

    <rect x="94" y="183" width="14" height="14" rx="4" fill="#8b5cf6" />
    <rect x="118" y="187" width="38" height="6" rx="3" fill="#334155" />

    <rect x="94" y="223" width="14" height="14" rx="4" fill="#f59e0b" />
    <rect x="118" y="227" width="30" height="6" rx="3" fill="#334155" />

    <rect x="94" y="263" width="14" height="14" rx="4" fill="#10b981" />
    <rect x="118" y="267" width="40" height="6" rx="3" fill="#334155" />

    <rect x="94" y="303" width="14" height="14" rx="4" fill="#f472b6" />
    <rect x="118" y="307" width="26" height="6" rx="3" fill="#334155" />
  </g>

  <line x1="182" y1="90" x2="182" y2="440" stroke="#1e293b" stroke-width="1" />

  <!-- main content -->
  <rect x="200" y="98" width="290" height="16" rx="8" fill="url(#titleGrad)" />
  <rect x="200" y="128" width="260" height="8" rx="4" fill="#334155" />
  <rect x="200" y="142" width="190" height="8" rx="4" fill="#334155" />

  <!-- insight diagram: prior state -> adopted template -->
  <rect x="200" y="172" width="112" height="46" rx="9" fill="#1a2436" stroke="#334155" stroke-width="1.3" />
  <text x="256" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#94a3b8">Ad-hoc</text>
  <text x="256" y="203" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#94a3b8">process</text>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b" />
    </marker>
  </defs>
  <line x1="316" y1="195" x2="366" y2="195" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrowhead)" />
  <text x="341" y="185" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="7" fill="#64748b">adopts</text>

  <rect x="370" y="172" width="120" height="46" rx="9" fill="url(#nodeBGrad)" />
  <text x="430" y="192" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#ffffff">Structured</text>
  <text x="430" y="203" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#ffffff">template</text>

  <!-- checklist -->
  <g>
    <rect x="200" y="240" width="17" height="17" rx="4" fill="url(#nodeBGrad)" />
    <path d="M204 248.5 L208 252.5 L214 244.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="227" y="245.5" width="230" height="7" rx="3.5" fill="#334155" />

    <rect x="200" y="271" width="17" height="17" rx="4" fill="#10b981" />
    <path d="M204 279.5 L208 283.5 L214 275.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="227" y="276.5" width="180" height="7" rx="3.5" fill="#334155" />

    <rect x="200" y="302" width="17" height="17" rx="4" fill="none" stroke="#475569" stroke-width="1.6" />
    <rect x="227" y="307.5" width="210" height="7" rx="3.5" fill="#293548" />

    <rect x="200" y="333" width="17" height="17" rx="4" fill="none" stroke="#475569" stroke-width="1.6" />
    <rect x="227" y="338.5" width="150" height="7" rx="3.5" fill="#293548" />
  </g>

  <!-- footer meta lines -->
  <rect x="200" y="392" width="90" height="7" rx="3.5" fill="#1e293b" />
  <rect x="300" y="392" width="70" height="7" rx="3.5" fill="#1e293b" />

  <!-- floating shield badge -->
  <g filter="url(#badgeGlow)">
    <circle cx="540" cy="432" r="34" fill="url(#badgeGrad)" />
  </g>
  <path d="M540 414 L556 420 V432 C556 442 549 449 540 452 C531 449 524 442 524 432 V420 Z"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
  <path d="M533 432 L538 437 L548 425" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
